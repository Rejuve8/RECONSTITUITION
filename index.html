<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#18110d">
  <title>Rejuvé Labs | Peptide Reconstitution Guide</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, sans-serif;
      background: #18110d;
      color: #fff7ed;
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    body { margin: 0; }

    main {
      width: min(100%, 74rem);
      margin: 0 auto;
      padding: clamp(.5rem, 2.5vw, 1.75rem);
    }

    .slide {
      position: relative;
      aspect-ratio: var(--slide-ratio, 16 / 9);
      overflow: hidden;
      border-radius: .75rem;
      background: #2b180e;
    }

    .slide img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .slide img[data-loading] { visibility: hidden; }

    .vial-option {
      position: absolute;
      top: 47.6%;
      width: 28.1%;
      height: 18.3%;
      border: 0;
      border-radius: 999px;
      background: transparent;
      cursor: pointer;
    }

    .vial-option[data-strength="10"] { left: 6.2%; }
    .vial-option[data-strength="15"] { left: 36%; }
    .vial-option[data-strength="20"] { left: 65.8%; }

    @media (hover: hover) {
      .vial-option:hover {
        background: rgb(255 255 255 / 12%);
      }
    }

    :focus-visible {
      outline: 3px solid #ffcc87;
      outline-offset: 3px;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: .5rem;
      align-items: center;
      margin-top: clamp(.65rem, 2vw, 1rem);
    }

    .nav-button {
      min-height: 2.75rem;
      padding: .5rem clamp(.6rem, 2vw, 1.15rem);
      border: 1px solid #805330;
      border-radius: .5rem;
      background: #302016;
      color: #fff7ed;
      font: inherit;
      font-weight: 650;
      cursor: pointer;
    }

    #previous { justify-self: start; }
    #next { justify-self: end; }

    .nav-button:not(:disabled):hover { background: #492e1c; }

    #next:not(:disabled) {
      border-color: #ffad62;
      background: #ffad62;
      color: #271408;
    }

    #next:not(:disabled):hover { background: #ffc48e; }

    .nav-button:disabled {
      opacity: .48;
      cursor: default;
    }

    .position {
      margin: 0;
      color: #eed6c1;
      text-align: center;
      font-size: .875rem;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <main>
    <h1 class="visually-hidden">Rejuvé Labs Peptide Reconstitution Guide</h1>
    <section class="slide" aria-label="Current slide">
      <img id="artwork" src="slides/01.png" alt="Open the Kit">
      <div id="vial-options" role="group" aria-label="Select your vial strength" hidden>
        <button class="vial-option" type="button" data-strength="10" aria-label="10 mg"></button>
        <button class="vial-option" type="button" data-strength="15" aria-label="15 mg"></button>
        <button class="vial-option" type="button" data-strength="20" aria-label="20 mg"></button>
      </div>
    </section>

    <nav class="controls" aria-label="Slide navigation">
      <button id="previous" class="nav-button" type="button" disabled>← Previous</button>
      <p id="position" class="position" role="status" aria-atomic="true">Step 1 of 12</p>
      <button id="next" class="nav-button" type="button">Next →</button>
    </nav>
    <noscript><p>Enable JavaScript to navigate the slides.</p></noscript>
  </main>

  <script>
    const lastStep = 12;
    const choiceStep = 4;
    const strengths = ['10', '15', '20'];
    const titles = [
      'Open the Kit',
      'What You Need',
      'Clean the Stoppers',
      'Select Your Vial Strength',
      'Prepare the Bacteriostatic Water',
      'Add the Bacteriostatic Water',
      'Gently Mix the Solution',
      'Check the Solution',
      'Withdraw the Required Amount',
      'Inject the Dose',
      'Record and Track',
      'Final Step'
    ];

    const slide = document.querySelector('.slide');
    const artwork = document.querySelector('#artwork');
    const options = document.querySelector('#vial-options');
    const previous = document.querySelector('#previous');
    const next = document.querySelector('#next');
    const position = document.querySelector('#position');

    let step = 1;
    let strength = null;

    function render() {
      const url = new URLSearchParams(location.hash.slice(1));
      const requestedStep = Number(url.get('step') ?? 1);
      const requestedStrength = url.get('vial');
      strength = strengths.includes(requestedStrength) ? requestedStrength : null;
      step = Number.isInteger(requestedStep) && requestedStep >= 1 && requestedStep <= lastStep
        ? requestedStep
        : 1;
      if (step > choiceStep && !strength) step = choiceStep;

      const number = String(step).padStart(2, '0');
      const directory = step === 5 || step === 6 ? `slides/${strength}` : 'slides';
      const path = `${directory}/${number}.png`;
      if (artwork.getAttribute('src') !== path) {
        artwork.setAttribute('data-loading', '');
        artwork.src = path;
        fitSlide();
      }
      artwork.alt = titles[step - 1];
      options.hidden = step !== choiceStep;
      previous.disabled = step === 1;
      next.disabled = step === choiceStep || step === lastStep;
      const vial = step > choiceStep ? ` · ${strength} mg` : '';
      position.textContent = `Step ${step} of ${lastStep}${vial}`;
      document.title = `${titles[step - 1]} | Rejuvé Labs`;
    }

    function fitSlide() {
      if (artwork.complete && artwork.naturalWidth && artwork.naturalHeight) {
        slide.style.setProperty('--slide-ratio', `${artwork.naturalWidth} / ${artwork.naturalHeight}`);
        artwork.removeAttribute('data-loading');
      }
    }

    function goTo(target, vial = strength) {
      const url = new URLSearchParams({ step: target });
      if (target > choiceStep && vial) url.set('vial', vial);
      location.hash = url.toString();
      render();
    }

    previous.addEventListener('click', () => {
      goTo(step - 1);
      if (step === choiceStep) options.querySelector('button').focus();
      else if (step === 1) next.focus();
    });
    next.addEventListener('click', () => {
      goTo(step + 1);
      if (step === choiceStep) options.querySelector('button').focus();
      else if (step === lastStep) previous.focus();
    });
    for (const button of options.querySelectorAll('button')) {
      button.addEventListener('click', () => {
        goTo(choiceStep + 1, button.dataset.strength);
        next.focus();
      });
    }
    artwork.addEventListener('load', fitSlide);
    artwork.addEventListener('error', () => artwork.removeAttribute('data-loading'));
    window.addEventListener('hashchange', render);
    fitSlide();
    render();
  </script>
</body>
</html>
